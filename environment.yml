# Conda environment for GeoSWE development (GPU build).
#
#   conda env create -f environment.yml
#   conda activate geoswe
#   pip install -e .[all]
#
# For a CPU-only install you only need numpy; see docs/installation.md.
name: geoswe
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy>=1.24
  - scipy>=1.10
  - pandas>=2.0
  - matplotlib>=3.7
  - rasterio>=1.3
  - pyproj>=3.5
  - pip
  - pip:
      # GPU. The CUDA 12 build with its headers ([ctk]) runs on CUDA 12 and CUDA 13
      # drivers without a system toolkit. Keep exactly one CuPy build; omit for CPU-only.
      - cupy-cuda12x[ctk]>=14.0
      - mpi4py>=3.1
