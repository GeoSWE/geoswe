name: docs

# The same Sphinx build Read the Docs runs, as a CI gate: -W turns every warning
# (a broken reference, a malformed table, an autodoc import failure) into a failure,
# so a pull request cannot merge documentation that would then break the published
# site. Publishing itself is Read the Docs' job, from .readthedocs.yaml, which is
# why this workflow uploads nothing and creates no deployment.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[docs]"
      - run: python -m sphinx -b html -W --keep-going docs docs/_build
